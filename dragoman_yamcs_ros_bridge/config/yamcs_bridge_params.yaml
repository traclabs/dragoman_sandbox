# YAMCS-ROS Bridge Configuration

yamcs:
  url: "localhost:8090"
  instance: "dragoman"
  processor: "realtime"

bridges:
  # AllTypes telemetry packet
  - ros_message_type: "dragoman_sample_msgs/msg/AllTelemetryPacket"
    ros_topic: "/yamcs/all_types"
    yamcs_packet_name: "/AllTypes/AllTelemetryPacket"

  # MultiPacket temperature packet
  - ros_message_type: "dragoman_sample_msgs/msg/TemperaturePacket"
    ros_topic: "/yamcs/temperature"
    yamcs_packet_name: "/MultiPacket/TemperaturePacket"

  # MultiPacket voltage packet
  - ros_message_type: "dragoman_sample_msgs/msg/VoltagePacket"
    ros_topic: "/yamcs/voltage"
    yamcs_packet_name: "/MultiPacket/VoltagePacket"
